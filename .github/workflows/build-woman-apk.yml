name: Build Woman Tracker APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "womanapp/**"
      - "settings.gradle"
      - "build.gradle"
      - "gradle.properties"
      - ".github/workflows/build-woman-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 36
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build debug APK
        run: gradle --no-daemon :womanapp:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: woman-tracker-debug
          path: womanapp/build/outputs/apk/debug/womanapp-debug.apk
          if-no-files-found: error
